name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, and verify single EXE
        run: ./eng/Verify.ps1

      - name: Compile and test installer in isolated folders
        run: ./eng/TestInstaller.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-logs
          path: |
            artifacts/logs/
            artifacts/installer-verification/run-*/logs/
            artifacts/installer-verification/run-*/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload self-contained app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Neodash-Mod-Loader-win-x64
          path: artifacts/publish/Neodash Mod Loader.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-coverage
          path: artifacts/coverage/latest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Neodash-Mod-Loader-Setup
          path: artifacts/installer/ModLoaderSetup.exe
          if-no-files-found: error
          retention-days: 14
